# Not installed. Include inside the existing server { } block for
# project-feldspar.com, then `nginx -t && systemctl reload nginx`.
#
# The limit_req_zone must live in the http { } context (nginx.conf), not here:
#
#   limit_req_zone $binary_remote_addr zone=feldspar_scan:10m rate=10r/m;
#
location /scan/ {
    # Trailing slash on proxy_pass strips the /scan/ prefix, so the backend
    # sees / and /scan exactly as it does locally.
    proxy_pass http://127.0.0.1:8090/;

    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host             $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A scan is capped at 120 s inside the app; give nginx headroom.
    proxy_read_timeout 150s;
    proxy_send_timeout 150s;
    proxy_connect_timeout 5s;
    proxy_buffering off;

    # Burst absorbs the double-submit; the app still enforces 5 scans/hour/IP
    # and a 2-slot concurrency semaphore.
    limit_req zone=feldspar_scan burst=5 nodelay;
    limit_req_status 429;

    client_max_body_size 8k;
}
